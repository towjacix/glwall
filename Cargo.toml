[package]
name = "glwall"
version = "0.2.0"
edition = "2024"
description = "Standalone Wayland OpenGL ES 3.0 / EGL live and custom-shader wallpaper daemon"
license = "MIT"
repository = "https://github.com/towjacix/glwall"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"

[dependencies]
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
clap = { version = "4", features = ["derive"] }
glow = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
inotify = "0.11"
khronos-egl = { version = "6.0", features = ["dynamic"] }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
