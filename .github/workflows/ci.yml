name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install system build and headless Mesa EGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libegl-dev \
            libgl-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libegl-mesa0 \
            libgles2 \
            libgl1-mesa-dri \
            pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Headless shader compile validation (Mesa software EGL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo run --locked -- check-shader shaders/*.frag
