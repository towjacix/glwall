name: CI

on:
  push:
    branches: [main, gpu-video-interop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install system build and headless Mesa EGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libegl-dev \
            libgl-dev \
            libgbm-dev \
            libgles2-mesa-dev \
            libegl-mesa0 \
            libgles2 \
            libgl1-mesa-dri \
            ffmpeg \
            pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Headless shader compile validation (Mesa software EGL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo run --locked -- check-shader shaders/*.frag

      - name: Build hardware-test artifacts
        if: github.ref == 'refs/heads/gpu-video-interop'
        run: |
          cargo build --release --locked
          cargo test --locked --no-run --message-format=json | jq -r 'select(.profile.test == true and .executable != null) | .executable' > target/test-executables.txt
          cp "$(head -n 1 target/test-executables.txt)" target/glwall-tests

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/gpu-video-interop'
        with:
          name: gpu-video-interop
          path: |
            target/release/glwall
            target/glwall-tests
